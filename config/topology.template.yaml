gateway:
  nodes:
  - host: 127.0.0.1
    id: rollout-0
    inference:
      base_url: ${MODEL_BASE_URL}
      engine: ${INFERENCE_ENGINE}
    max_init_workers: 16
    max_postrun_workers: 8
    max_run_workers: 96
    model_served: ${MODEL_NAME}
    port: 8100
    public_url: http://127.0.0.1:8100
rollout:
  host: 127.0.0.1
  port: 8080
  public_url: http://127.0.0.1:8080
  save_dir: ${POLAR_HOME}/runs/rollouts
